name: Build Docker Image
on:
  push:
    branches:
      - main
    # release: git tag v2.1.0 && git push origin v2.1.0
    # (path filters are not evaluated for tag pushes, so tags always build)
    tags:
      - "v*"
    paths:
      - "backend/**"
      - "Dockerfile"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

# Image goes to the GitHub Container Registry of whoever owns this repo:
#   ghcr.io/<owner>/<repo>:latest   (newest build of main)
#   ghcr.io/<owner>/<repo>:2.1.0    (release tag v2.1.0)
#   ghcr.io/<owner>/<repo>:sha-xxxx (every build, for rollbacks)
# No secrets needed: the workflow's built-in GITHUB_TOKEN may push packages.

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push image to ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # full history + tags, needed for git describe

      - name: Determine version
        id: version
        run: |
          # v2.0.0 on a tag, v2.0.0-3-gabc1234 after it, plain short SHA without any tag
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.date }}
            REPO_URL=${{ github.server_url }}/${{ github.repository }}
