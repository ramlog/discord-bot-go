name: Build Docker Image
on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "Dockerfile"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

# Image goes to the GitHub Container Registry of whoever owns this repo:
#   ghcr.io/<owner>/<repo>:latest   (newest build of main)
#   ghcr.io/<owner>/<repo>:sha-xxxx (every build, for rollbacks)
# No secrets needed: the workflow's built-in GITHUB_TOKEN may push packages.

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push image to ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}